name: ci

on:
  pull_request:
    paths:
      - "**"
      - "!README.md"
      - "!docs/**"
      - "!**/*.md"
      - "!**/*.mdx"
      - "CHANGELOG.md"
  push:
    branches:
      - main
    paths:
      - "**"
      - "!README.md"
      - "!docs/**"
      - "!**/*.md"
      - "!**/*.mdx"
      - "CHANGELOG.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts blocks arbitrary lifecycle scripts from untrusted/unreviewed
      # dependencies; sharp and unrs-resolver are the two reviewed packages that
      # genuinely need their install scripts (native binaries), so they're
      # rebuilt explicitly right after.
      - run: npm ci --ignore-scripts
      - run: npm rebuild sharp unrs-resolver
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
